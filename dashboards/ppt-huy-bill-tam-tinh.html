<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đề xuất thay đổi quy trình Hủy bill tạm tính</title>
<style>
  :root{
    --bg:#0f172a;
    --panel:#111827;
    --accent:#f97316;
    --text:#e5e7eb;
    --muted:#94a3b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #1f2937;
  }
  header h1{
    font-size:15px;
    font-weight:600;
    margin:0;
    color:var(--text);
    max-width:70%;
  }
  header .count{
    color:var(--muted);
    font-size:13px;
    white-space:nowrap;
  }
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:1100px;
  }
  .stage img{
    width:100%;
    height:auto;
    display:block;
    border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    background:#fff;
  }
  .nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(17,24,39,.8);
    border:1px solid #374151;
    color:var(--text);
    width:44px;
    height:44px;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .nav-btn:hover{ background:var(--accent); border-color:var(--accent); }
  .nav-btn.prev{ left:-56px; }
  .nav-btn.next{ right:-56px; }
  @media (max-width:900px){
    .nav-btn.prev{ left:6px; }
    .nav-btn.next{ right:6px; }
  }
  footer{
    padding:14px 24px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .thumbs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    max-width:100%;
    padding:4px;
  }
  .thumbs img{
    width:78px;
    height:44px;
    object-fit:cover;
    border-radius:6px;
    cursor:pointer;
    border:2px solid transparent;
    opacity:.55;
    transition:opacity .15s, border-color .15s;
    background:#fff;
  }
  .thumbs img.active{
    opacity:1;
    border-color:var(--accent);
  }
  .hint{
    color:var(--muted);
    font-size:12px;
  }
</style>
</head>
<body>

<header>
  <h1>Đề xuất thay đổi quy trình Hủy bill tạm tính</h1>
  <div class="count"><span id="cur">1</span> / <span id="total">8</span></div>
</header>

<main>
  <div class="stage">
    <button class="nav-btn prev" id="prevBtn" aria-label="Slide trước">&#8249;</button>
    <img id="slideImg" src="slide-1.jpg" alt="Slide 1">
    <button class="nav-btn next" id="nextBtn" aria-label="Slide sau">&#8250;</button>
  </div>
</main>

<footer>
  <div class="thumbs" id="thumbs"></div>
  <div class="hint">Dùng phím ← → hoặc bấm mũi tên / thumbnail để chuyển slide</div>
</footer>

<script>
  const totalSlides = 8;
  let current = 1;
  const img = document.getElementById('slideImg');
  const cur = document.getElementById('cur');
  const thumbs = document.getElementById('thumbs');

  for(let i=1;i<=totalSlides;i++){
    const t = document.createElement('img');
    t.src = `slide-${i}.jpg`;
    t.dataset.index = i;
    t.addEventListener('click', ()=>goTo(i));
    thumbs.appendChild(t);
  }

  function render(){
    img.src = `slide-${current}.jpg`;
    img.alt = `Slide ${current}`;
    cur.textContent = current;
    [...thumbs.children].forEach(t=>{
      t.classList.toggle('active', Number(t.dataset.index) === current);
    });
    document.querySelector(`.thumbs img.active`)?.scrollIntoView({inline:'center', block:'nearest'});
  }

  function goTo(n){
    current = ((n-1+totalSlides)%totalSlides)+1;
    render();
  }

  document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
  document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowRight') goTo(current+1);
    if(e.key === 'ArrowLeft') goTo(current-1);
  });

  render();
</script>

</body>
</html>
