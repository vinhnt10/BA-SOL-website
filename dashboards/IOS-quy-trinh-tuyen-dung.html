<style>
  :root {
    --sol-red: #a8231f;
    --sol-dark: #1a1a1a;
    --sol-bg: #f7f5f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--sol-bg); color: var(--sol-dark); }
  header { background: var(--sol-dark); color: #fff; padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: #bbb; margin-top: 2px; }
  .toolbar { display: flex; gap: 8px; }
  .toolbar button { background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .toolbar button:hover { background: var(--sol-red); border-color: var(--sol-red); }
  #layout { display: flex; height: calc(100vh - 60px); }
  #canvas { flex: 1; background: #ffffff repeating-linear-gradient(0deg, transparent, transparent 24px, #f0f0f0 25px), repeating-linear-gradient(90deg, transparent, transparent 24px, #f0f0f0 25px); }
  #sidebar { width: 300px; border-left: 1px solid #ddd; background: #fff; overflow-y: auto; padding: 14px; }
  #sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #888; margin: 0 0 10px; }
  .doc-item { border: 1px solid #eee; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .doc-item .task-name { font-size: 12.5px; font-weight: 600; color: var(--sol-dark); margin-bottom: 6px; }
  .doc-item a { display: block; font-size: 12.5px; color: var(--sol-red); text-decoration: none; margin-bottom: 4px; }
  .doc-item a:hover { text-decoration: underline; }
  .empty-note { font-size: 12.5px; color: #999; }
  .bjs-powered-by { display: none !important; }
  .note-overlay { pointer-events: none; }
  .note-overlay a {
    pointer-events: all;
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--sol-red); color: #fff; text-decoration: none;
    font-size: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    border: 2px solid #fff;
  }
  .note-overlay a:hover { background: #7a1a17; }
</style>

  var viewer = new BpmnJS({ container: '#canvas' });

  var taskNames = {};

  function renderSidebar(elementRegistry) {
    var list = document.getElementById('doc-list');
    var ids = Object.keys(linkMap);
    if (ids.length === 0) {
      list.innerHTML = '<div class="empty-note">Không có tài liệu tham khảo.</div>';
      return;
    }
    ids.forEach(function (id) {
      var el = elementRegistry.get(id);
      var name = el && el.businessObject && el.businessObject.name ? el.businessObject.name : id;
      var box = document.createElement('div');
      box.className = 'doc-item';
      var title = document.createElement('div');
      title.className = 'task-name';
      title.textContent = name;
      box.appendChild(title);
      linkMap[id].forEach(function (doc) {
        var a = document.createElement('a');
        a.href = doc.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = '↗ ' + doc.label;
        box.appendChild(a);
      });
      box.addEventListener('mouseenter', function () {
        try {
          viewer.get('canvas').addMarker(id, 'highlight-hover');
        } catch (e) {}
      });
      box.addEventListener('mouseleave', function () {
        try {
          viewer.get('canvas').removeMarker(id, 'highlight-hover');
        } catch (e) {}
      });
      list.appendChild(box);
    });
  }

  function addOverlayIcons(overlays, elementRegistry) {
    Object.keys(linkMap).forEach(function (id) {
      var el = elementRegistry.get(id);
      if (!el) return;
      var docs = linkMap[id];
      var linksHtml = docs.map(function (d) {
        return '<a href="' + d.url + '" target="_blank" rel="noopener noreferrer" title="' + d.label.replace(/"/g, '&quot;') + '">📎</a>';
      }).join('');
      var html = document.createElement('div');
      html.className = 'note-overlay';
      html.innerHTML = linksHtml;
      overlays.add(id, 'note', {
        position: { top: -14, right: -6 },
        html: html
      });
    });
  }

  viewer.importXML(bpmnXML).then(function () {
    var canvas = viewer.get('canvas');
    var overlays = viewer.get('overlays');
    var elementRegistry = viewer.get('elementRegistry');
    canvas.zoom('fit-viewport');
    addOverlayIcons(overlays, elementRegistry);
    renderSidebar(elementRegistry);
  }).catch(function (err) {
    document.getElementById('canvas').innerHTML =
      '<div style="padding:20px;color:#a8231f;font-family:monospace;">Lỗi khi render BPMN: ' + (err && err.message ? err.message : err) + '</div>';
    console.error('BPMN import error', err);
  });

  document.getElementById('btn-zoom-in').onclick = function () {
    var canvas = viewer.get('canvas');
    canvas.zoom(canvas.zoom() * 1.2);
  };
  document.getElementById('btn-zoom-out').onclick = function () {
    var canvas = viewer.get('canvas');
    canvas.zoom(canvas.zoom() / 1.2);
  };
  document.getElementById('btn-fit').onclick = function () {
    viewer.get('canvas').zoom('fit-viewport');
